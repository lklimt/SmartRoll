<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="white"/>
<text x="700" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">SMARTROLL – TESTOVACÍ SOUPRAVA</text>
<text x="700" y="90" text-anchor="middle" font-family="Arial" font-size="22">Arduino Nano + 2× Hall A3144EUA-T („44E“)</text>
<text x="700" y="125" text-anchor="middle" font-family="Arial" font-size="15">Rev. 1.0 – TESTOVACÍ ZAPOJENÍ / NEZAMYKÁ FINÁLNÍ KONSTRUKCI</text>

<!-- rails -->
<line x1="120" y1="190" x2="1240" y2="190" stroke="#d00" stroke-width="5"/>
<text x="1250" y="196" font-family="Arial" font-size="18" fill="#b00">+5 V</text>
<line x1="120" y1="760" x2="1240" y2="760" stroke="#111" stroke-width="5"/>
<text x="1250" y="766" font-family="Arial" font-size="18">GND</text>

<!-- Arduino -->
<rect x="490" y="230" width="260" height="480" rx="12" fill="#eee" stroke="#222" stroke-width="3"/>
<text x="620" y="285" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold">ARDUINO NANO</text>
<text x="620" y="315" text-anchor="middle" font-family="Arial" font-size="15">5 V test supply</text>

<!-- pins -->
<circle cx="490" cy="350" r="8" fill="#d00"/><text x="470" y="356" text-anchor="end" font-family="Arial" font-size="17">5V</text>
<circle cx="490" cy="650" r="8" fill="#111"/><text x="470" y="656" text-anchor="end" font-family="Arial" font-size="17">GND</text>
<circle cx="750" cy="430" r="8" fill="#080"/><text x="770" y="436" font-family="Arial" font-size="17">D2 – Hall A</text>
<circle cx="750" cy="520" r="8" fill="#080"/><text x="770" y="526" font-family="Arial" font-size="17">D3 – Hall B</text>

<line x1="490" y1="350" x2="490" y2="190" stroke="#d00" stroke-width="4"/>
<line x1="490" y1="650" x2="490" y2="760" stroke="#111" stroke-width="4"/>

<!-- Hall A -->
<rect x="930" y="270" width="230" height="180" rx="10" fill="#fafafa" stroke="#222" stroke-width="3"/>
<text x="1045" y="300" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">HALL A</text>
<text x="1045" y="325" text-anchor="middle" font-family="Arial" font-size="16">A3144EUA-T / „44E“</text>
<text x="970" y="365" font-family="Arial" font-size="16">pin 1 = OUT</text>
<text x="970" y="395" font-family="Arial" font-size="16">pin 2 = GND</text>
<text x="970" y="425" font-family="Arial" font-size="16">pin 3 = VCC</text>

<!-- Hall B -->
<rect x="930" y="530" width="230" height="180" rx="10" fill="#fafafa" stroke="#222" stroke-width="3"/>
<text x="1045" y="560" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">HALL B</text>
<text x="1045" y="585" text-anchor="middle" font-family="Arial" font-size="16">A3144EUA-T / „44E“</text>
<text x="970" y="625" font-family="Arial" font-size="16">pin 1 = OUT</text>
<text x="970" y="655" font-family="Arial" font-size="16">pin 2 = GND</text>
<text x="970" y="685" font-family="Arial" font-size="16">pin 3 = VCC</text>

<!-- pullups -->
<rect x="800" y="230" width="70" height="70" fill="white" stroke="#222" stroke-width="2"/>
<text x="835" y="258" text-anchor="middle" font-family="Arial" font-size="14">R1</text><text x="835" y="280" text-anchor="middle" font-family="Arial" font-size="14">10 kΩ</text>
<line x1="835" y1="230" x2="835" y2="190" stroke="#d00" stroke-width="3"/>
<line x1="835" y1="300" x2="835" y2="430" stroke="#080" stroke-width="3"/>
<line x1="750" y1="430" x2="835" y2="430" stroke="#080" stroke-width="3"/>
<line x1="835" y1="430" x2="930" y2="365" stroke="#080" stroke-width="3"/>

<rect x="800" y="490" width="70" height="70" fill="white" stroke="#222" stroke-width="2"/>
<text x="835" y="518" text-anchor="middle" font-family="Arial" font-size="14">R2</text><text x="835" y="540" text-anchor="middle" font-family="Arial" font-size="14">10 kΩ</text>
<line x1="835" y1="490" x2="835" y2="190" stroke="#d00" stroke-width="3"/>
<line x1="835" y1="560" x2="835" y2="520" stroke="#080" stroke-width="3"/>
<line x1="750" y1="520" x2="835" y2="520" stroke="#080" stroke-width="3"/>
<line x1="835" y1="520" x2="930" y2="625" stroke="#080" stroke-width="3"/>

<!-- sensor VCC/GND symbolic connections -->
<line x1="1160" y1="425" x2="1210" y2="425" stroke="#d00" stroke-width="3"/><line x1="1210" y1="425" x2="1210" y2="190" stroke="#d00" stroke-width="3"/>
<line x1="1160" y1="395" x2="1240" y2="395" stroke="#111" stroke-width="3"/><line x1="1240" y1="395" x2="1240" y2="760" stroke="#111" stroke-width="3"/>
<line x1="1160" y1="685" x2="1240" y2="685" stroke="#111" stroke-width="3"/>
<line x1="1160" y1="655" x2="1210" y2="655" stroke="#d00" stroke-width="3"/><line x1="1210" y1="655" x2="1210" y2="190" stroke="#d00" stroke-width="3"/>

<!-- notes -->
<rect x="80" y="230" width="330" height="300" rx="10" fill="#f8f8f8" stroke="#777" stroke-width="2"/>
<text x="105" y="265" font-family="Arial" font-size="20" font-weight="bold">POZNÁMKY</text>
<text x="105" y="300" font-family="Arial" font-size="16">• A3144EUA-T má otevřený kolektor.</text>
<text x="105" y="330" font-family="Arial" font-size="16">• Proto je použit pull-up 10 kΩ.</text>
<text x="105" y="360" font-family="Arial" font-size="16">• OUT A → D2</text>
<text x="105" y="390" font-family="Arial" font-size="16">• OUT B → D3</text>
<text x="105" y="420" font-family="Arial" font-size="16">• Oba Hall senzory mají společné</text>
<text x="125" y="445" font-family="Arial" font-size="16">+5 V a GND.</text>
<text x="105" y="480" font-family="Arial" font-size="16">• 100 nF mezi VCC a GND u každého</text>
<text x="125" y="505" font-family="Arial" font-size="16">senzoru je doporučený.</text>

<rect x="80" y="570" width="330" height="150" rx="10" fill="#f8f8f8" stroke="#777" stroke-width="2"/>
<text x="105" y="605" font-family="Arial" font-size="20" font-weight="bold">TEST</text>
<text x="105" y="638" font-family="Arial" font-size="16">1. Napájej Nano 5 V.</text>
<text x="105" y="665" font-family="Arial" font-size="16">2. Spusť sériový monitor.</text>
<text x="105" y="692" font-family="Arial" font-size="16">3. Otáčej testovacím kotoučem.</text>

<text x="700" y="840" text-anchor="middle" font-family="Arial" font-size="15">DŮLEŽITÉ: Před zapojením ověř orientaci vývodů konkrétního kusu podle datasheetu A3144EUA-T.</text>
<text x="700" y="870" text-anchor="middle" font-family="Arial" font-size="14">SmartRoll / tests/hall_sensor_test / SR-HALL-TEST-002</text>
</svg>